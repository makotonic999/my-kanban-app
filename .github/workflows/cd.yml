name: CD

# main への push でアプリを AWS にデプロイする。
# 前提: `terraform apply` 済みでインフラ（ECR/ECS 等）が存在し、
#        リポジトリ変数 AWS_ROLE_ARN に OIDC ロール ARN が設定されていること。
# インフラ未構築の間は手動実行(workflow_dispatch)のみを想定。

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "frontend/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: kanban-dev-api
  ECS_CLUSTER: kanban-dev-cluster
  ECS_SERVICE: kanban-dev-api
  ECS_TASK_FAMILY: kanban-dev-api
  CONTAINER_NAME: api

# OIDC で一時クレデンシャルを取得するために必須。
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & deploy to ECS
    runs-on: ubuntu-latest
    # ロール ARN 未設定なら安全に skip（インフラ未構築時の誤爆防止）。
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-def.json

      - name: Render new task definition with image
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-frontend:
    name: Build & deploy frontend to S3 + CloudFront
    runs-on: ubuntu-latest
    # ロール ARN 未設定なら安全に skip（インフラ未構築時の誤爆防止）。
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # 本番の API オリジンを注入（未設定なら Vite 既定の /api を使用）。
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        # 宛先はリポジトリ変数から取得（terraform output を GitHub Variables に登録して運用）。
        # 未設定時は安全に skip。
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          FRONTEND_DISTRIBUTION_ID: ${{ vars.FRONTEND_DISTRIBUTION_ID }}
        run: |
          if [ -z "$FRONTEND_BUCKET" ] || [ -z "$FRONTEND_DISTRIBUTION_ID" ]; then
            echo "FRONTEND_BUCKET / FRONTEND_DISTRIBUTION_ID 未設定のため skip します。"
            exit 0
          fi
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$FRONTEND_DISTRIBUTION_ID" \
            --paths "/*"
